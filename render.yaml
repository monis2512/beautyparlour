services:
  - type: web
    name: luxury-edits
    runtime: docker
    plan: free

    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      - key: DB_HOST
        fromDatabase:
          name: my-parlour-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: my-parlour-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: my-parlour-db
          property: database

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: my-parlour-db
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: my-parlour-db
          property: password

      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: my-parlour-db
    databaseName: my_parlour
    user: my_parlour_user
    plan: free
