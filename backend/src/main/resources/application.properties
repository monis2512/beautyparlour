spring.application.name=my-parlour
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Render PostgreSQL values are supplied automatically by render.yaml.
# Local fallback keeps the project easy to run on a computer.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myparlour}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

spring.mvc.hiddenmethod.filter.enabled=true
